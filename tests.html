<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confidence Calculator regression tests</title>
<h1>Regression tests</h1>
<pre id="results" role="status">Running...</pre>
<iframe id="calculator" title="Calculator under test" style="width:100%;height:800px" src="index.html?vis=2400&amp;conf=0.95&amp;pwr=0.80&amp;type=2&amp;cd=33&amp;cn=800&amp;cc=80&amp;since=14&amp;scupl=20&amp;calc=off&amp;proj=0&amp;sb=1&amp;dd=0&amp;nv=2&amp;vd0=38&amp;vn0=900&amp;vc0=100&amp;vd1=29&amp;vn1=700&amp;vc1=90"></iframe>
<script>
document.getElementById('calculator').addEventListener('load', async () => {
  const frame = document.getElementById('calculator');
  const calculator = frame.contentWindow;
  const results = [];
  const assert = (condition, name) => {
    results.push(`${condition ? 'PASS' : 'FAIL'} ${name}`);
    if (!condition) throw new Error(name);
  };
  const close = (actual, expected, tolerance = 0.000001) => Math.abs(actual - expected) < tolerance;
  try {
    assert(typeof calculator.relativeInterval === 'function', 'Calculator loaded');
    const exampleP = calculator.pFromZ(calculator.zTest(316786, 124688, 316005, 128676).z, 2);
    assert(exampleP > 0 && exampleP < 0.000001, 'Reported example retains a nonzero, very small p-value');
    assert(calculator.pFromZ(10, 2) > 0 && close(calculator.pFromZ(10, 2) / 1.5239706048321e-23, 1, 0.03), 'Extreme normal tails avoid cancellation to zero');
    assert(calculator.pFromZ(9, 2) > calculator.pFromZ(10, 2) && calculator.pFromZ(-10, 2) === calculator.pFromZ(10, 2), 'Tiny p-values respond to data and two-sided direction is symmetric');
    assert(calculator.formatPValue(exampleP) === '< 0.000001' && calculator.formatPValue(0) === '< 0.000001' &&
      calculator.formatPValue(0.0000123) === '0.000012' && calculator.formatPValue(0.04) === '0.0400', 'Plain decimal p-values never round tiny results to zero');
    const interval = calculator.relativeInterval(1000, 100, 1000, 112);
    assert(close(interval.uplift, 0.12) && close(interval.lower, -0.131427419) && close(interval.upper, 0.444552166), 'Score interval numerical regression');
    const significant = calculator.relativeInterval(1000, 100, 1000, 150);
    assert(significant.lower > 0 && significant.upper > significant.uplift, 'Second illustrative dataset excludes zero');
    const wider = calculator.relativeInterval(1000, 100, 1000, 112, 0.01);
    assert(wider.lower < interval.lower && wider.upper > interval.upper, 'Selected confidence level changes interval width');
    const swapped = calculator.relativeInterval(1000, 112, 1000, 100);
    assert(close(swapped.lower, 1/(1+interval.upper)-1) && close(swapped.upper, 1/(1+interval.lower)-1), 'Group swapping inverts relative-rate interval');
    let comparisons = 0;
    for (const n1 of [10, 100, 1000]) for (const n2 of [15, 100, 1500])
    for (const fraction1 of [0.01, 0.1, 0.5, 1, 1.5]) for (const fraction2 of [0, 0.02, 0.12, 0.5, 1, 2])
    for (const alpha of [0.1, 0.05, 0.01, 0.00001, 0.05/5]) {
      const c1 = Math.max(1, Math.round(n1*fraction1)), c2 = Math.round(n2*fraction2);
      const bounds = calculator.relativeInterval(n1, c1, n2, c2, alpha);
      const p = calculator.pFromZ(calculator.zTest(n1, c1, n2, c2).z, 2);
      if ((bounds.lower > 0 || bounds.upper < 0) !== (p < alpha)) throw new Error('Test/interval mismatch');
      if (!(bounds.lower <= bounds.uplift && bounds.upper >= bounds.uplift)) throw new Error('Estimate outside interval');
      comparisons++;
    }
    assert(comparisons === 1350, '1,350 test/interval checks: unequal allocation, boundaries, Poisson counts and Bonferroni');
    assert(calculator.relativeInterval(0, 0, 100, 10) === null && calculator.relativeInterval(10, -1, 10, 2) === null && calculator.relativeInterval(10, 1.5, 10, 2) === null, 'Invalid counts and zero visitors rejected');
    assert(calculator.relativeInterval(100, 0, 100, 10).uplift === null && calculator.relativeInterval(100, 0, 100, 0).lower === null, 'Zero control conversions explicitly undefined');
    const zero = calculator.relativeInterval(1000, 100, 1000, 0);
    assert(zero.lower === -1 && zero.upper < 0, 'Zero variant conversions: -100% estimate with non-degenerate interval');
    const oneSided = calculator.relativeInterval(1000, 100, 1000, 150, 0.05, 1);
    assert(oneSided.lower > 0 && oneSided.upper === Infinity && calculator.pFromZ(-3, 1) > 0.99, 'One-sided increase test uses direction and unbounded upper endpoint');
    assert(close(calculator.powerFromN(1000, 1000, 0.1, 0.1, 0.05, 2), 5, 0.001), 'Power at zero assumed effect equals alpha');
    assert(calculator.powerFromN(5000, 5000, 0.1, 0.12, 0.05, 2) > calculator.powerFromN(1000, 1000, 0.1, 0.12, 0.05, 2), 'Power grows with sample size');
    assert(calculator.powerFromN(1000, 1000, 0.1, 0.12, 0.01, 2) < calculator.powerFromN(1000, 1000, 0.1, 0.12, 0.05, 2), 'Stricter alpha reduces power');
    const observedUplift = (163222 / 305750) / (164621 / 306636) - 1;
    const forecastP = (days, uplift = observedUplift, traffic = 1, tails = 2) => calculator.projectedPValue(
      306636, 164621, 305750, 163222, 306636 / 30 * traffic, 305750 / 30 * traffic, days, uplift, tails);
    assert(close(forecastP(0), 0.01782805431905432), 'Shared example is not significant at 99% on day 30');
    assert(forecastP(5) > 0.01 && forecastP(6) < 0.01, 'Observed negative effect crosses the two-sided threshold on day 36');
    assert(close(forecastP(0, observedUplift * 2, 2), forecastP(0)), 'Future uplift and traffic never rewrite current evidence');
    assert(forecastP(6, observedUplift * 2) < forecastP(6) && forecastP(6, observedUplift * 0.5) > forecastP(6), 'Future effect scenarios use cumulative conversions');
    assert(forecastP(6, observedUplift, 2) < forecastP(6) && forecastP(6, observedUplift, 0.5) > forecastP(6), 'Traffic scenarios change only future visitors');
    const sameStart = calculator.projectedPValue(306636, 164621, 305750, 163222, 306636 / 30, 305750 / 30, 0, 0.1, 2);
    assert(close(sameStart, forecastP(0)), 'All effect scenarios start from the same measured p-value');
    assert(forecastP(1000, observedUplift, 1, 1) > 0.99, 'Negative uplift never signals a one-sided increase');
    assert(calculator.projectedPValue(0, 0, 10, 1, 1, 1, 0, 0.1, 2) === null && calculator.projectedPValue(10, 9, 10, 9, 1, 1, 1, 1, 2) === null, 'Invalid samples and impossible binary future rates rejected');
    const doc = calculator.document;
    for (const id of ['confidence', 'interval', 'pvalue', 'nullhypothesis', 'althypothesis', 'zscore', 'uplift', 'power', 'bonferroni', 'chartScale']) {
      calculator.openConcept(id);
      const firstExplanation = doc.querySelector('#sidebarBody > p').textContent;
      assert(firstExplanation.includes('95% confidence') && firstExplanation.includes('alpha') &&
        firstExplanation.includes('p-value') && firstExplanation.includes('statistically significant'),
        `${id} help starts with the connection between confidence, alpha, p-value and significance`);
    }
    calculator.closeSidebar();
    const confidenceHelp = doc.querySelector('[data-concept="confidence"]');
    confidenceHelp.dispatchEvent(new calculator.MouseEvent('mouseover', { bubbles: true }));
    assert(doc.querySelector('.tip').textContent.startsWith('95% confidence') &&
      doc.querySelector('.tip').textContent.includes('p-value below alpha'), 'Static help tooltips lead with the same statistical relationship');
    confidenceHelp.dispatchEvent(new calculator.MouseEvent('mouseout', { bubbles: true }));
    for (const [confidence, adjusted] of [
      ['0.90', '95%'], ['0.95', '97.5%'], ['0.99', '99.5%'],
      ['0.999', '99.95%'], ['0.9999', '99.995%'], ['0.99999', '99.9995%'],
    ]) {
      const option = doc.querySelector(`input[name="sConf"][value="${confidence}"]`);
      option.click();
      assert(doc.getElementById('bfTargetConf').textContent === option.nextElementSibling.textContent &&
        doc.getElementById('bfAlpha').textContent === adjusted &&
        calculator.getComputedStyle(doc.getElementById('bonferroniAlert')).display !== 'none',
        `Multiple-variant notice matches sidebar precision and shows the stricter level at ${option.nextElementSibling.textContent}`);
    }
    doc.querySelector('input[name="sConf"][value="0.95"]').click();
    for (const [from, to, backwards] of [['ctrl-n', 'ctrl-c', false], ['ctrl-c', 'v0-n', false], ['v0-n', 'v0-c', false], ['v0-c', 'v1-n', false], ['v1-n', 'v0-c', true], ['v0-n', 'ctrl-c', true]]) {
      const target = doc.getElementById(to);
      let selected = false;
      const select = target.select;
      target.select = function () { selected = true; select.call(this); };
      doc.getElementById(from).focus();
      doc.getElementById(from).dispatchEvent(new calculator.KeyboardEvent('keydown', { key: 'Tab', shiftKey: backwards, bubbles: true, cancelable: true }));
      assert(doc.activeElement.id === to, `Data-entry Tab order: ${from} to ${to}`);
      assert(selected, `Tab selects the full destination value: ${from} to ${to}`);
      target.select = select;
    }
    const nameField = doc.getElementById('testName');
    nameField.value = 'Checkout test';
    doc.getElementById('ctrl-n').focus();
    doc.dispatchEvent(new calculator.KeyboardEvent('keydown', { key: 'Tab', shiftKey: true, bubbles: true }));
    nameField.focus();
    assert(nameField.selectionStart === 0 && nameField.selectionEnd === nameField.value.length, 'Native Tab focus selects the full test name');
    doc.getElementById('ctrl-n').focus();
    nameField.setSelectionRange(2, 2);
    doc.dispatchEvent(new calculator.PointerEvent('pointerdown', { bubbles: true }));
    nameField.focus();
    assert(nameField.selectionStart === 2 && nameField.selectionEnd === 2, 'Pointer focus preserves caret placement');
    const assumed = doc.getElementById('scUplift').value;
    doc.getElementById('v0-c').value = 250;
    calculator.recalc();
    assert(doc.getElementById('scUplift').value === assumed, 'Observed uplift never overwrites power effect');
    calculator.setCalcMode('off');
    assert(calculator.getComputedStyle(doc.getElementById('effect-v0')).display !== 'none', 'Uplift and interval visible with calculation details off');
    assert(doc.querySelectorAll('#effect-v0 .effect-metric').length === 2 && !doc.querySelector('#effect-v0 > span'), 'Two compact metrics without inline explanation');
    assert(doc.querySelector('#effect-v0 .effect-axis-zero').textContent === '0%' && doc.querySelector('#effect-v0 .effect-axis-point'), 'Interval is a number line with zero and point estimate');
    assert(doc.querySelectorAll('#effect-v0 .effect-label')[1].textContent.trim() === 'Confidence interval ?', 'Confidence interval uses its full, consistent name');
    doc.querySelector('#result-v0 .rc-compact .help-btn').click();
    assert(doc.getElementById('sidebarLabel').textContent === 'p-value' && doc.getElementById('sidebarBody').textContent.includes('Different names, different jobs'), 'Compact p-value help explains threshold, confidence level and interval');
    calculator.closeSidebar();
    const previousPText = doc.querySelector('#result-v0 .rc-compact').textContent;
    doc.getElementById('v0-c').value = 100;
    calculator.recalc();
    assert(doc.querySelector('#result-v0 .rc-compact').textContent !== previousPText &&
      doc.querySelector('#result-v0 .rc-compact').textContent.includes('p-value = '), 'Editing conversions updates the visible p-value, not just the calculation');
    doc.getElementById('v0-c').value = 250;
    calculator.recalc();
    const axisProbe = doc.createElement('div');
    for (const bounds of [interval, significant, zero, oneSided, { lower: 0, upper: 0, uplift: 0 }]) {
      axisProbe.innerHTML = calculator.renderEffectInterval(bounds);
      const axis = axisProbe.querySelector('.effect-axis');
      assert(axis && !/NaN|Infinity/.test(axis.getAttribute('style')) && parseFloat(axis.style.getPropertyValue('--estimate')) >= 8 && parseFloat(axis.style.getPropertyValue('--estimate')) <= 96, 'Finite number-line geometry for interval boundary case');
    }
    assert(axisProbe.querySelector('.effect-axis'), 'Zero-width interval renders');
    axisProbe.innerHTML = calculator.renderEffectInterval(oneSided);
    assert(axisProbe.querySelector('.effect-axis--open') && axisProbe.textContent.includes('∞'), 'One-sided interval has an open-ended arrow');
    axisProbe.innerHTML = calculator.renderEffectInterval({ uplift: null, lower: null, upper: null });
    assert(!axisProbe.querySelector('.effect-axis'), 'Undefined interval does not draw a misleading line');
    doc.querySelector('#effect-v0 button[aria-label="About the confidence interval"]').click();
    assert(doc.getElementById('sidebarLabel').textContent === 'Uplift confidence interval' && doc.getElementById('conceptSidebar').classList.contains('is-open'), 'Interval help opens common concept sidebar');
    calculator.closeSidebar();
    doc.getElementById('ctrl-c').value = 0;
    calculator.recalc();
    assert(doc.getElementById('effect-v0').textContent.includes('undefined'), 'Zero control conversions visibly undefined');
    doc.getElementById('ctrl-c').value = 80;
    doc.getElementById('v0-n').value = 0;
    calculator.recalc();
    assert(doc.getElementById('currentPower').textContent.includes('unavailable'), 'Zero-visitor variant is not omitted from power calculation');
    doc.getElementById('ctrl-n').value = 0;
    calculator.recalc();
    assert(doc.getElementById('result-v0').textContent.trim() === 'Check inputs?', 'Invalid counts show a short status, not explanatory prose');
    doc.querySelector('#result-v0 button').click();
    assert(doc.getElementById('sidebarLabel').textContent === 'Input requirements', 'Input requirements available behind help');
    calculator.closeSidebar();
    doc.getElementById('ctrl-n').value = 800;
    doc.getElementById('v0-n').value = 900;
    calculator.recalc();
    calculator.toggleProjection(true, true);
    assert(!doc.getElementById('secProjection').classList.contains('proj-hidden'), 'Projection toggle shows the whole section');
    const scaleSwitch = doc.getElementById('pChartScale');
    assert(scaleSwitch.type === 'checkbox' && scaleSwitch.closest('.calc-toggle') &&
      scaleSwitch.closest('#projectionMetrics') && doc.getElementById('scenStatRow').closest('#projectionMetrics'),
      'Chart scale uses the common switch inside the metrics strip');
    const chart = id => calculator.Chart.getChart(doc.getElementById(id));
    assert(chart('cConf').options.scales.y.type === 'linear' && chart('cVis').options.scales.y.min === 0, 'p-value charts default to an unfloored linear scale');
    assert(doc.getElementById('scenStatRow').querySelectorAll('.scen-stat').length === 4 &&
      !doc.getElementById('scenStatRow').textContent.includes('Control Conversion rate') &&
      !doc.getElementById('scenStatRow').textContent.includes('Observed uplift'), 'Projection summary omits repeated rate, uplift and scenario legend');
    scaleSwitch.click();
    assert(chart('cConf').options.scales.y.type === 'logarithmic' && chart('cVis').options.scales.y.min === 0.000001 &&
      calculator.buildStateParams().get('scale') === 'logarithmic', 'Scale switch updates both projection charts and share URL');
    assert(calculator.plotPValue(exampleP) === 0.000001 && !chart('cConf').options.scales.y.ticks.callback(0.000001).includes('e-'), 'Log floor is plotting-only and axis ticks use decimals');
    const data = { dates: ['2026-10-14', '2026-10-15'], groups: [
      { label: 'Control', n: [1000, 1000], c: [100, 100] },
      { label: 'Variant A', n: [1000, 1000], c: [150, 150] },
      { label: 'Variant B', n: [1000, 1000], c: [120, 120] },
    ] };
    calculator.setDeepData(data, 'test');
    doc.getElementById('deepToggle').checked = true;
    calculator.toggleDeepDive(true, true);
    assert(chart('cDeepConf').options.scales.y.type === 'logarithmic' &&
      close(chart('cDeepConf').data.datasets[0].data[0], calculator.pFromZ(calculator.zTest(1000, 100, 1000, 150).z, 2)), 'Daily-history chart uses the same p-value metric and scale');
    scaleSwitch.click();
    assert(chart('cDeepConf').options.scales.y.type === 'linear' && chart('cConf').options.scales.y.type === 'linear' &&
      calculator.plotPValue(exampleP) === exampleP, 'Switching back to linear restores unrounded p-values in all charts');
    calculator.setDeepData(null);
    calculator.toggleProjection(false, true);
    assert(!doc.getElementById('projectionMetrics').classList.contains('proj-hidden'), 'Metrics switch remains available with deep dive alone');
    doc.getElementById('deepToggle').checked = false;
    calculator.toggleDeepDive(false, true);
    assert(doc.getElementById('projectionMetrics').classList.contains('proj-hidden'), 'Metrics strip hides when both chart sections are off');
    const testName = 'Checkout & "Unicorn" <test> 🦄';
    doc.getElementById('testName').value = testName;
    calculator.updateTestName();
    assert(calculator.document.title === `${testName} - Confidence Calculator` &&
      new URLSearchParams(calculator.location.search).get('name') === testName, 'Test name safely updates document title and URL with special characters');
    doc.getElementById('testName').value = '   ';
    calculator.updateTestName();
    assert(calculator.document.title === 'Confidence Calculator - A/B Test Calculator' &&
      !calculator.buildStateParams().has('name'), 'Clearing the test name restores default title and removes URL parameter');
    calculator.toggleProjection(false, true);
    assert(doc.getElementById('secProjection').classList.contains('proj-hidden'), 'Projection toggle hides the whole section');
    const defaultsFrame = document.createElement('iframe');
    defaultsFrame.hidden = true;
    const defaultsLoaded = new Promise(resolve => defaultsFrame.addEventListener('load', resolve, { once: true }));
    defaultsFrame.src = 'index.html';
    document.body.append(defaultsFrame);
    await defaultsLoaded;
    const defaults = defaultsFrame.contentDocument;
    assert(defaults.getElementById('calcToggle').dataset.state === 'off' && defaults.getElementById('groupsGrid').classList.contains('calc-collapsed'), 'Fresh start uses the simplest calculator');
    assert(!defaults.getElementById('projToggle').checked && !defaults.getElementById('deepToggle').checked && defaults.getElementById('secProjection').classList.contains('proj-hidden') && defaults.getElementById('projectionSidebar').classList.contains('proj-hidden'), 'Fresh start hides projection, planning inputs and deep dive');
    assert(defaults.querySelectorAll('.group-col:not(.group-col--add)').length === 2, 'Fresh start contains only control and one variant');
    assert(defaults.getElementById('bonferroniAlert').style.display === 'none', 'One variant does not show a multiple-comparison adjustment');
    const sharedLoaded = new Promise(resolve => defaultsFrame.addEventListener('load', resolve, { once: true }));
    defaultsFrame.src = 'index.html?vis=10000&calc=full&proj=1&dd=1&nv=1&name=Checkout+%26+Unicorn&scale=logarithmic';
    await sharedLoaded;
    const shared = defaultsFrame.contentDocument;
    assert(shared.getElementById('calcToggle').dataset.state === 'full' && shared.getElementById('projToggle').checked && shared.getElementById('deepToggle').checked && !shared.getElementById('secProjection').classList.contains('proj-hidden'), 'Explicit shared options override simple starting defaults');
    assert(shared.getElementById('testName').value === 'Checkout & Unicorn' &&
      shared.title === 'Checkout & Unicorn - Confidence Calculator' &&
      shared.getElementById('pChartScale').checked, 'Shared links restore the test name, browser title and chart scale');
    defaultsFrame.remove();
    results.push('All checks passed.');
    document.documentElement.dataset.tests = 'passed';
  } catch (error) {
    results.push(`ERROR ${error.message}`);
    document.documentElement.dataset.tests = 'failed';
  }
  document.getElementById('results').textContent = results.join('\n');
});
</script>
</html>
